name: publish-smart-sync

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write   # Required for PyPI Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'hca-smart-sync-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hca-smart-sync/

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry

      - name: Build package
        working-directory: smart-sync
        run: |
          poetry build
          ls -la dist/

      - name: Check metadata (twine)
        working-directory: smart-sync
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "twine>=5.1.1" "pkginfo>=1.10.0" "packaging>=24.0"
          python -m twine --version
          python -m twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: smart-sync/dist
          # No username/password/token needed with Trusted Publishing
